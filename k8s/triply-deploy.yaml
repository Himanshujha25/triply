# ---------------- FRONTEND DEPLOYMENT ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triply-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triply-frontend
  template:
    metadata:
      labels:
        app: triply-frontend
    spec:
      containers:
        - name: triply-frontend
          image: jhahimanshu25/triply-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
# ---------------- FRONTEND SERVICE ----------------
apiVersion: v1
kind: Service
metadata:
  name: triply-frontend-service
spec:
  selector:
    app: triply-frontend
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
---
# ---------------- BACKEND DEPLOYMENT ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triply-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triply-backend
  template:
    metadata:
      labels:
        app: triply-backend
    spec:
      containers:
        - name: triply-backend
          image: jhahimanshu25/triply-backend:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
# ---------------- BACKEND SERVICE ----------------
apiVersion: v1
kind: Service
metadata:
  name: triply-backend-service
spec:
  selector:
    app: triply-backend
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
